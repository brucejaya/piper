name: Piper
options:
  bundleIdPrefix: app.piper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  PiperApp:
    type: application
    platform: iOS
    sources:
      - PiperApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.piper.ios
        INFOPLIST_FILE: PiperApp/Resources/Info.plist
    info:
      path: PiperApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Piper
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Piper connects directly to paired agent instances on networks you control.
    scheme:
      testTargets:
        - PiperAppTests
  PiperAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PiperAppTests
    dependencies:
      - target: PiperApp
