name: iOS

on:
  push:
    paths:
      - ".github/workflows/ios.yml"
      - "apps/ios/**"
      - "scripts/ios-mac-build.sh"
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "apps/ios/**"
      - "scripts/ios-mac-build.sh"

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and test iOS app
        run: bash scripts/ios-mac-build.sh
